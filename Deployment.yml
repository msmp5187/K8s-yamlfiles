apiVersion: apps/v1  
kind: Deployment
metadata:
  name: springboot-deployment
  namespace: prod123
  labels:
    app: springboot123 
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: springapp
  template:
    metadata:
      labels:
        app: springapp
    spec:
      containers:
        - name: springapp-pod
          image: saidockerrepo/springapp
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: springboot-service
  namespace: prod123
spec:
  type: NodePort
  selector:
    app: springapp
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
